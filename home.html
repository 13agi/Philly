<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<meta name="theme-color" content="#07152F">

<title>Philly</title>

<style>

/* =========================================================
   RESET
   ========================================================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    width: 100%;
    min-height: 100%;
}

body {
    background: #07152F;
    color: #FFFFFF;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        Arial,
        sans-serif;

    -webkit-font-smoothing: antialiased;

    overflow-x: hidden;
}


/* =========================================================
   VARIABLES
   ========================================================= */

:root {

    --red: #E81828;
    --red-dark: #B90F1D;
    --red-light: #FF3040;

    --navy: #07152F;
    --navy-dark: #040D1D;
    --navy-card: #0B1F40;
    --navy-light: #10284E;

    --white: #FFFFFF;
    --muted: #8E9DB5;

    --header-height: 72px;
    --bottom-height: 76px;

    --safe-top: env(safe-area-inset-top);
    --safe-bottom: env(safe-area-inset-bottom);
}


/* =========================================================
   APP
   ========================================================= */

.app {
    width: 100%;
    min-height: 100dvh;

    background:
        radial-gradient(
            circle at 100% 0%,
            rgba(232,24,40,0.13),
            transparent 34%
        ),
        linear-gradient(
            180deg,
            #07152F 0%,
            #081936 55%,
            #040D1D 100%
        );
}


/* =========================================================
   HEADER
   ========================================================= */

.header {

    position: fixed;

    top: 0;
    left: 0;
    right: 0;

    height:
        calc(
            var(--header-height)
            + var(--safe-top)
        );

    padding-top: var(--safe-top);

    z-index: 1000;

    overflow: hidden;

    background:
        linear-gradient(
            125deg,
            #E81828 0%,
            #D91627 48%,
            #B90F1D 100%
        );

    box-shadow:
        0 8px 26px rgba(0,0,0,0.3);
}


/* 赤の光 */

.header::before {

    content: "";

    position: absolute;

    width: 170px;
    height: 170px;

    top: -110px;
    left: -55px;

    border-radius: 50%;

    background:
        rgba(255,255,255,0.10);
}


/* ネイビー斜線 */

.header::after {

    content: "";

    position: absolute;

    top: 0;
    right: 0;

    width: 45%;
    height: 100%;

    background:
        linear-gradient(
            135deg,
            transparent 0%,
            transparent 48%,
            #07152F 49%,
            #07152F 100%
        );
}


/* =========================================================
   HEADER MARK
   ========================================================= */

.header-inner {

    position: relative;

    width: 100%;
    height: var(--header-height);

    display: flex;

    align-items: center;
    justify-content: center;

    z-index: 2;
}


.header-mark {

    position: relative;

    width: 42px;
    height: 42px;

    border:
        2px solid
        rgba(255,255,255,0.9);

    border-radius: 50%;

    transform: rotate(-8deg);

    box-shadow:
        0 0 0 5px rgba(255,255,255,0.06),
        0 6px 18px rgba(0,0,0,0.2);
}


.header-mark::before {

    content: "";

    position: absolute;

    inset: 7px;

    border-radius: 50%;

    background: #07152F;

    border:
        1px solid
        rgba(255,255,255,0.15);
}


.header-mark::after {

    content: "";

    position: absolute;

    width: 5px;
    height: 30px;

    left: 17px;
    top: 4px;

    border-radius: 99px;

    background: #E81828;

    transform: rotate(45deg);
}


/* =========================================================
   MAIN
   ========================================================= */

main {

    width: 100%;

    padding-top:
        calc(
            var(--header-height)
            + var(--safe-top)
        );

    padding-bottom:
        calc(
            var(--bottom-height)
            + var(--safe-bottom)
            + 20px
        );
}


/* =========================================================
   HOME HERO
   ========================================================= */

.home-hero {

    position: relative;

    padding:
        30px
        20px
        20px;

    overflow: hidden;
}


.hero-line {

    display: flex;

    align-items: center;

    gap: 8px;

    margin-bottom: 10px;

    color: #E81828;

    font-size: 10px;

    font-weight: 900;

    letter-spacing: .18em;
}


.hero-line::before {

    content: "";

    width: 20px;
    height: 2px;

    border-radius: 99px;

    background: #E81828;
}


.home-title {

    font-size: 36px;

    line-height: 1.02;

    font-weight: 900;

    letter-spacing: -0.055em;
}


.home-description {

    margin-top: 11px;

    color: #8E9DB5;

    font-size: 13px;

    line-height: 1.6;
}


/* =========================================================
   MAIN GAME CARD
   ========================================================= */

.game-card {

    position: relative;

    margin:
        0
        16px
        14px;

    padding: 20px;

    min-height: 215px;

    overflow: hidden;

    border-radius: 22px;

    background:
        linear-gradient(
            145deg,
            #10284E 0%,
            #0B1F40 52%,
            #07152F 100%
        );

    border:
        1px solid
        rgba(255,255,255,0.09);

    box-shadow:
        0 15px 35px
        rgba(0,0,0,0.25);
}


/* 赤い円 */

.game-card::before {

    content: "";

    position: absolute;

    width: 190px;
    height: 190px;

    top: -95px;
    right: -75px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(232,24,40,0.30),
            transparent 70%
        );
}


/* 斜めアクセント */

.game-card::after {

    content: "";

    position: absolute;

    right: -70px;
    bottom: 15px;

    width: 220px;
    height: 3px;

    background:
        rgba(232,24,40,0.35);

    transform: rotate(-28deg);
}


/* =========================================================
   GAME CARD CONTENT
   ========================================================= */

.game-card-content {

    position: relative;

    z-index: 2;
}


.game-label {

    color: #8E9DB5;

    font-size: 9px;

    font-weight: 900;

    letter-spacing: .17em;
}


.game-status {

    display: inline-flex;

    align-items: center;

    gap: 6px;

    margin-top: 13px;

    padding:
        6px
        9px;

    border-radius: 99px;

    background:
        rgba(232,24,40,0.12);

    color: #FF3040;

    font-size: 9px;

    font-weight: 900;

    letter-spacing: .08em;
}


.game-status-dot {

    width: 6px;
    height: 6px;

    border-radius: 50%;

    background: #E81828;

    box-shadow:
        0 0 8px
        rgba(232,24,40,0.7);
}


.game-teams {

    display: flex;

    align-items: center;
    justify-content: space-between;

    margin-top: 20px;
}


.team {

    display: flex;

    flex-direction: column;

    gap: 5px;
}


.team-name {

    font-size: 18px;

    font-weight: 850;

    letter-spacing: -0.03em;
}


.team-label {

    color: #71809A;

    font-size: 9px;

    font-weight: 700;

    letter-spacing: .1em;
}


.game-vs {

    width: 34px;
    height: 34px;

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 50%;

    color: #8E9DB5;

    background:
        rgba(255,255,255,0.045);

    font-size: 10px;

    font-weight: 900;
}


/* =========================================================
   QUICK MENU
   ========================================================= */

.section {

    padding:
        4px
        16px
        0;
}


.section-header {

    display: flex;

    align-items: center;
    justify-content: space-between;

    padding:
        8px
        4px
        12px;
}


.section-title {

    font-size: 15px;

    font-weight: 850;

    letter-spacing: -0.02em;
}


.section-line {

    width: 25px;
    height: 3px;

    border-radius: 99px;

    background: #E81828;

    box-shadow:
        0 0 9px
        rgba(232,24,40,0.45);
}


.quick-grid {

    display: grid;

    grid-template-columns:
        repeat(2, minmax(0,1fr));

    gap: 10px;
}


.quick-card {

    position: relative;

    min-height: 115px;

    padding: 16px;

    overflow: hidden;

    border-radius: 17px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,0.065),
            rgba(255,255,255,0.025)
        );

    border:
        1px solid
        rgba(255,255,255,0.075);

    transition:
        transform .15s ease;
}


.quick-card:active {

    transform: scale(.97);
}


.quick-icon {

    width: 32px;
    height: 32px;

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 10px;

    color: #E81828;

    background:
        rgba(232,24,40,0.10);
}


.quick-icon svg {

    width: 18px;
    height: 18px;

    fill: none;

    stroke: currentColor;

    stroke-width: 1.8;

    stroke-linecap: round;
    stroke-linejoin: round;
}


.quick-title {

    margin-top: 13px;

    font-size: 12px;

    font-weight: 850;
}


.quick-text {

    margin-top: 4px;

    color: #63738D;

    font-size: 10px;
}


/* =========================================================
   BOTTOM NAV
   ========================================================= */

.bottom-nav {

    position: fixed;

    left: 0;
    right: 0;
    bottom: 0;

    height:
        calc(
            var(--bottom-height)
            + var(--safe-bottom)
        );

    padding-bottom:
        var(--safe-bottom);

    z-index: 2000;

    background:
        rgba(4,13,29,0.96);

    border-top:
        1px solid
        rgba(255,255,255,0.075);

    box-shadow:
        0 -10px 30px
        rgba(0,0,0,0.3);

    backdrop-filter: blur(22px);
    -webkit-backdrop-filter: blur(22px);
}


.bottom-nav-inner {

    width: 100%;
    height: var(--bottom-height);

    display: grid;

    grid-template-columns:
        repeat(5,1fr);
}


/* =========================================================
   NAV ITEM
   ========================================================= */

.nav-item {

    position: relative;

    display: flex;

    flex-direction: column;

    align-items: center;
    justify-content: center;

    gap: 5px;

    color: #71809A;

    text-decoration: none;

    transition:
        color .18s ease,
        transform .18s ease;
}


.nav-item:active {

    transform: scale(.92);
}


/* =========================================================
   NAV ICON
   ========================================================= */

.nav-icon {

    width: 21px;
    height: 21px;

    fill: none;

    stroke: currentColor;

    stroke-width: 1.9;

    stroke-linecap: round;
    stroke-linejoin: round;
}


.nav-label {

    font-size: 8px;

    font-weight: 850;

    letter-spacing: .065em;

    line-height: 1;
}


/* =========================================================
   ACTIVE
   ========================================================= */

.nav-item.active {

    color: #E81828;
}


.nav-item.active .nav-icon {

    filter:
        drop-shadow(
            0 0 7px
            rgba(232,24,40,.5)
        );

    transform:
        translateY(-1px);
}


.nav-item.active::after {

    content: "";

    position: absolute;

    left: 50%;
    bottom: 5px;

    width: 22px;
    height: 3px;

    transform:
        translateX(-50%);

    border-radius: 99px;

    background: #E81828;
}


/* =========================================================
   HOME BUTTON
   ========================================================= */

.nav-home .home-circle {

    position: relative;

    width: 42px;
    height: 42px;

    margin-top: -9px;

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 50%;

    color: #FFFFFF;

    background:
        linear-gradient(
            145deg,
            #FF3040,
            #B90F1D
        );

    border:
        3px solid
        #07152F;

    box-shadow:
        0 6px 20px
        rgba(232,24,40,.4);
}


.nav-home .home-circle::before {

    content: "";

    position: absolute;

    inset: -4px;

    border-radius: 50%;

    border:
        1px solid
        rgba(232,24,40,.25);
}


.nav-home .nav-icon {

    width: 20px;
    height: 20px;

    stroke-width: 2.15;
}


.nav-home.active {

    color: #FFFFFF;
}


.nav-home.active::after {

    display: none;
}


/* =========================================================
   SMALL DEVICES
   ========================================================= */

@media (max-width: 360px) {

    :root {

        --header-height: 68px;
        --bottom-height: 72px;
    }

    .home-title {

        font-size: 32px;
    }

    .nav-icon {

        width: 20px;
        height: 20px;
    }

    .nav-label {

        font-size: 7.5px;
    }

    .nav-home .home-circle {

        width: 39px;
        height: 39px;
    }
}


/* =========================================================
   REDUCED MOTION
   ========================================================= */

@media (prefers-reduced-motion: reduce) {

    * {

        transition: none !important;
    }
}

</style>
</head>


<body>

<div class="app">


    <!-- =====================================================
         HEADER
         ====================================================== -->

    <header class="header">

        <div class="header-inner">

            <div
                class="header-mark"
                aria-hidden="true"
            ></div>

        </div>

    </header>


    <!-- =====================================================
         MAIN
         ====================================================== -->

    <main>


        <!-- HERO -->

        <section class="home-hero">

            <div class="hero-line">
                PHILLIES BASEBALL
            </div>

            <h1 class="home-title">
                Welcome to<br>
                Philly.
            </h1>

            <p class="home-description">
                Your Phillies, all in one place.
            </p>

        </section>


        <!-- MAIN GAME -->

        <section class="game-card">

            <div class="game-card-content">

                <div class="game-label">
                    NEXT GAME
                </div>

                <div class="game-status">

                    <span class="game-status-dot"></span>

                    UPCOMING

                </div>

                <div class="game-teams">

                    <div class="team">

                        <div class="team-label">
                            HOME
                        </div>

                        <div class="team-name">
                            PHI
                        </div>

                    </div>


                    <div class="game-vs">
                        VS
                    </div>


                    <div class="team">

                        <div class="team-label">
                            AWAY
                        </div>

                        <div class="team-name">
                            —
                        </div>

                    </div>

                </div>

            </div>

        </section>


        <!-- QUICK ACCESS -->

        <section class="section">

            <div class="section-header">

                <h2 class="section-title">
                    Quick Access
                </h2>

                <span class="section-line"></span>

            </div>


            <div class="quick-grid">


                <!-- SCHEDULE -->

                <a
                    href="schedule.html"
                    class="quick-card"
                >

                    <div class="quick-icon">

                        <svg viewBox="0 0 24 24">

                            <rect
                                x="3"
                                y="5"
                                width="18"
                                height="16"
                                rx="3"
                            />

                            <path d="M7 3v4"/>
                            <path d="M17 3v4"/>
                            <path d="M3 10h18"/>

                            <path d="M8 14h.01"/>
                            <path d="M12 14h.01"/>
                            <path d="M16 14h.01"/>

                        </svg>

                    </div>

                    <div class="quick-title">
                        Schedule
                    </div>

                    <div class="quick-text">
                        試合日程
                    </div>

                </a>


                <!-- SCORE -->

                <a
                    href="score.html"
                    class="quick-card"
                >

                    <div class="quick-icon">

                        <svg viewBox="0 0 24 24">

                            <rect
                                x="3"
                                y="5"
                                width="18"
                                height="14"
                                rx="2"
                            />

                            <path d="M7 9h4"/>
                            <path d="M13 9h4"/>

                            <path d="M7 13h2"/>
                            <path d="M11 13h2"/>
                            <path d="M15 13h2"/>

                        </svg>

                    </div>

                    <div class="quick-title">
                        Score
                    </div>

                    <div class="quick-text">
                        試合速報・結果
                    </div>

                </a>


                <!-- PLAYER -->

                <a
                    href="player.html"
                    class="quick-card"
                >

                    <div class="quick-icon">

                        <svg viewBox="0 0 24 24">

                            <circle
                                cx="12"
                                cy="8"
                                r="3.5"
                            />

                            <path
                                d="M5 20c.7-4 3-6 7-6s6.3 2 7 6"
                            />

                        </svg>

                    </div>

                    <div class="quick-title">
                        Player
                    </div>

                    <div class="quick-text">
                        選手情報
                    </div>

                </a>


                <!-- STATS -->

                <a
                    href="stats.html"
                    class="quick-card"
                >

                    <div class="quick-icon">

                        <svg viewBox="0 0 24 24">

                            <path d="M4 20V10"/>
                            <path d="M10 20V4"/>
                            <path d="M16 20v-7"/>
                            <path d="M22 20V7"/>

                        </svg>

                    </div>

                    <div class="quick-title">
                        Stats
                    </div>

                    <div class="quick-text">
                        チーム・選手成績
                    </div>

                </a>


            </div>

        </section>


    </main>


    <!-- =====================================================
         BOTTOM NAV
         ====================================================== -->

    <nav
        class="bottom-nav"
        aria-label="Main navigation"
    >

        <div class="bottom-nav-inner">


            <!-- SCHEDULE -->

            <a
                href="schedule.html"
                class="nav-item"
            >

                <svg
                    class="nav-icon"
                    viewBox="0 0 24 24"
                >

                    <rect
                        x="3"
                        y="5"
                        width="18"
                        height="16"
                        rx="3"
                    />

                    <path d="M7 3v4"/>
                    <path d="M17 3v4"/>
                    <path d="M3 10h18"/>

                    <path d="M8 14h.01"/>
                    <path d="M12 14h.01"/>
                    <path d="M16 14h.01"/>

                    <path d="M8 18h.01"/>
                    <path d="M12 18h.01"/>
                    <path d="M16 18h.01"/>

                </svg>

                <span class="nav-label">
                    SCHEDULE
                </span>

            </a>


            <!-- SCORE -->

            <a
                href="score.html"
                class="nav-item"
            >

                <svg
                    class="nav-icon"
                    viewBox="0 0 24 24"
                >

                    <rect
                        x="3"
                        y="5"
                        width="18"
                        height="14"
                        rx="2"
                    />

                    <path d="M7 9h4"/>
                    <path d="M13 9h4"/>

                    <path d="M7 13h2"/>
                    <path d="M11 13h2"/>
                    <path d="M15 13h2"/>

                    <path d="M7 16h10"/>

                </svg>

                <span class="nav-label">
                    SCORE
                </span>

            </a>


            <!-- HOME -->

            <a
                href="home.html"
                class="nav-item nav-home active"
                aria-current="page"
            >

                <span class="home-circle">

                    <svg
                        class="nav-icon"
                        viewBox="0 0 24 24"
                    >

                        <path d="M3 11.5 12 4l9 7.5"/>

                        <path
                            d="M5 10.5V20h14v-9.5"
                        />

                        <path
                            d="M9 20v-5h6v5"
                        />

                    </svg>

                </span>

                <span class="nav-label">
                    HOME
                </span>

            </a>


            <!-- PLAYER -->

            <a
                href="player.html"
                class="nav-item"
            >

                <svg
                    class="nav-icon"
                    viewBox="0 0 24 24"
                >

                    <circle
                        cx="12"
                        cy="8"
                        r="3.5"
                    />

                    <path
                        d="M5 20c.7-4 3-6 7-6s6.3 2 7 6"
                    />

                </svg>

                <span class="nav-label">
                    PLAYER
                </span>

            </a>


            <!-- STATS -->

            <a
                href="stats.html"
                class="nav-item"
            >

                <svg
                    class="nav-icon"
                    viewBox="0 0 24 24"
                >

                    <path d="M4 20V10"/>
                    <path d="M10 20V4"/>
                    <path d="M16 20v-7"/>
                    <path d="M22 20V7"/>

                </svg>

                <span class="nav-label">
                    STATS
                </span>

            </a>


        </div>

    </nav>


</div>

</body>
</html>
