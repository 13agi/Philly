<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<meta name="theme-color" content="#07152F">

<title>Philly</title>

<style>

/* =========================================================
   Philly
   COMMON MOBILE UI
   ========================================================= */

:root {

    --red: #E81828;
    --red-dark: #B90F1D;
    --red-light: #FF3040;

    --navy-950: #040D1D;
    --navy-900: #07152F;
    --navy-850: #091A37;
    --navy-800: #0B1F40;

    --white: #FFFFFF;
    --muted: #8E9DB5;

    --line: rgba(255,255,255,0.075);

    --header-height: 72px;
    --nav-height: 76px;

    --safe-top: env(safe-area-inset-top);
    --safe-bottom: env(safe-area-inset-bottom);
}


/* =========================================================
   RESET
   ========================================================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;

    -webkit-tap-highlight-color: transparent;
}

html {
    width: 100%;
    min-height: 100%;

    background: var(--navy-950);

    overscroll-behavior-x: none;
}

body {

    width: 100%;
    min-height: 100dvh;

    margin: 0;

    background:
        radial-gradient(
            100% 45% at 100% 0%,
            rgba(232,24,40,0.12),
            transparent 60%
        ),
        linear-gradient(
            180deg,
            var(--navy-900) 0%,
            var(--navy-850) 50%,
            var(--navy-950) 100%
        );

    color: var(--white);

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        Arial,
        sans-serif;

    -webkit-font-smoothing: antialiased;

    overflow-x: hidden;
}


/* =========================================================
   APP
   ========================================================= */

.app {

    position: relative;

    width: 100%;
    min-height: 100dvh;
}


/* =========================================================
   HEADER
   ========================================================= */

.site-header {

    position: fixed;

    top: 0;
    left: 0;
    right: 0;

    height:
        calc(
            var(--header-height)
            + var(--safe-top)
        );

    padding-top: var(--safe-top);

    z-index: 1000;

    overflow: hidden;

    background:
        linear-gradient(
            125deg,
            #E81828 0%,
            #D91627 48%,
            #C31121 100%
        );

    box-shadow:
        0 8px 26px rgba(0,0,0,0.28);
}


/* ---------------------------------------------------------
   Header highlight
   --------------------------------------------------------- */

.site-header::before {

    content: "";

    position: absolute;

    top: -35%;
    left: -20%;

    width: 80%;
    height: 170%;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,0.10),
            transparent 52%
        );

    transform: skewX(-18deg);

    pointer-events: none;
}


/* ---------------------------------------------------------
   Header navy layer
   --------------------------------------------------------- */

.site-header::after {

    content: "";

    position: absolute;

    top: 0;
    right: 0;

    width: 42%;
    height: 100%;

    background:
        linear-gradient(
            135deg,
            transparent 0%,
            transparent 47%,
            var(--navy-900) 48%,
            var(--navy-900) 100%
        );

    pointer-events: none;
}


/* =========================================================
   HEADER INNER
   ========================================================= */

.header-inner {

    position: relative;

    width: 100%;
    height: var(--header-height);

    display: flex;

    align-items: center;
    justify-content: center;

    z-index: 2;
}


/* =========================================================
   HEADER MARK
   ========================================================= */

.header-emblem {

    position: relative;

    width: 42px;
    height: 42px;

    border-radius: 50%;

    border:
        2px solid
        rgba(255,255,255,0.88);

    box-shadow:
        0 0 0 5px rgba(255,255,255,0.055),
        0 7px 20px rgba(0,0,0,0.18);

    transform: rotate(-8deg);
}


.header-emblem::before {

    content: "";

    position: absolute;

    inset: 7px;

    border-radius: 50%;

    background: var(--navy-900);

    border:
        1px solid
        rgba(255,255,255,0.16);
}


.header-emblem::after {

    content: "";

    position: absolute;

    width: 5px;
    height: 30px;

    left: 17px;
    top: 4px;

    border-radius: 99px;

    background: var(--red);

    transform: rotate(45deg);
}


/* =========================================================
   MAIN
   ========================================================= */

main {

    width: 100%;
    min-height: 100dvh;

    padding-top:
        calc(
            var(--header-height)
            + var(--safe-top)
        );

    padding-bottom:
        calc(
            var(--nav-height)
            + var(--safe-bottom)
        );
}


/* =========================================================
   CONTENT
   ========================================================= */

/*
   HOMEページのコンテンツはここから追加する。

   現在はUIのみのため空。
*/


.home-content {

    width: 100%;
    min-height: calc(
        100dvh
        - var(--header-height)
        - var(--nav-height)
        - var(--safe-top)
        - var(--safe-bottom)
    );
}


/* =========================================================
   BOTTOM NAVIGATION
   ========================================================= */

.bottom-nav {

    position: fixed;

    left: 0;
    right: 0;
    bottom: 0;

    height:
        calc(
            var(--nav-height)
            + var(--safe-bottom)
        );

    padding-bottom: var(--safe-bottom);

    z-index: 2000;

    background:
        rgba(4,13,29,0.95);

    border-top:
        1px solid
        var(--line);

    box-shadow:
        0 -10px 30px
        rgba(0,0,0,0.30);

    backdrop-filter: blur(22px);
    -webkit-backdrop-filter: blur(22px);
}


/* =========================================================
   NAV INNER
   ========================================================= */

.bottom-nav-inner {

    width: 100%;
    height: var(--nav-height);

    display: grid;

    grid-template-columns:
        repeat(5, 1fr);

    align-items: stretch;
}


/* =========================================================
   NAV ITEM
   ========================================================= */

.nav-item {

    position: relative;

    display: flex;

    flex-direction: column;

    align-items: center;
    justify-content: center;

    gap: 5px;

    min-width: 0;

    color: #71809A;

    text-decoration: none;

    transition:
        color .18s ease,
        transform .18s ease;
}


.nav-item:active {

    transform: scale(.92);
}


/* =========================================================
   NAV ICON
   ========================================================= */

.nav-icon {

    width: 21px;
    height: 21px;

    fill: none;

    stroke: currentColor;

    stroke-width: 1.9;

    stroke-linecap: round;
    stroke-linejoin: round;

    transition:
        transform .18s ease,
        filter .18s ease;
}


/* =========================================================
   NAV LABEL
   ========================================================= */

.nav-label {

    font-size: 8px;

    line-height: 1;

    font-weight: 850;

    letter-spacing: .065em;

    white-space: nowrap;
}


/* =========================================================
   ACTIVE
   ========================================================= */

.nav-item.active {

    color: var(--red);
}


.nav-item.active .nav-icon {

    transform: translateY(-1px);

    filter:
        drop-shadow(
            0 0 7px
            rgba(232,24,40,0.48)
        );
}


.nav-item.active::after {

    content: "";

    position: absolute;

    left: 50%;
    bottom: 5px;

    width: 22px;
    height: 3px;

    transform:
        translateX(-50%);

    border-radius: 99px;

    background: var(--red);

    box-shadow:
        0 0 10px
        rgba(232,24,40,0.55);
}


/* =========================================================
   HOME
   ========================================================= */

.nav-home {

    justify-content: center;
}


.nav-home .home-circle {

    position: relative;

    width: 42px;
    height: 42px;

    margin-top: -9px;

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 50%;

    color: white;

    background:
        linear-gradient(
            145deg,
            var(--red-light),
            var(--red-dark)
        );

    border:
        3px solid
        var(--navy-900);

    box-shadow:
        0 5px 18px
        rgba(232,24,40,0.34),

        0 0 0 1px
        rgba(232,24,40,0.20);
}


.nav-home .home-circle::before {

    content: "";

    position: absolute;

    inset: -4px;

    border-radius: 50%;

    border:
        1px solid
        rgba(232,24,40,0.22);
}


.nav-home .nav-icon {

    width: 20px;
    height: 20px;

    stroke-width: 2.15;
}


.nav-home.active {

    color: white;
}


.nav-home.active::after {

    display: none;
}


.nav-home.active .home-circle {

    box-shadow:
        0 0 0 4px
        rgba(232,24,40,0.10),

        0 7px 22px
        rgba(232,24,40,0.46);
}


/* =========================================================
   SMALL iPHONE
   ========================================================= */

@media (max-width: 360px) {

    :root {

        --header-height: 68px;
        --nav-height: 72px;
    }

    .nav-label {

        font-size: 7.5px;
    }

    .nav-icon {

        width: 20px;
        height: 20px;
    }

    .nav-home .home-circle {

        width: 39px;
        height: 39px;
    }
}


/* =========================================================
   REDUCED MOTION
   ========================================================= */

@media (prefers-reduced-motion: reduce) {

    *,
    *::before,
    *::after {

        transition: none !important;
    }
}

</style>
</head>


<body>

<div class="app">


    <!-- =====================================================
         HEADER
         ====================================================== -->

    <header class="site-header">

        <div class="header-inner">

            <div
                class="header-emblem"
                aria-hidden="true"
            ></div>

        </div>

    </header>


    <!-- =====================================================
         MAIN
         ====================================================== -->

    <main>

        <div class="home-content">
            <!-- HOME CONTENT -->
        </div>

    </main>


    <!-- =====================================================
         BOTTOM NAVIGATION
         ====================================================== -->

    <nav
        class="bottom-nav"
        aria-label="Main navigation"
    >

        <div class="bottom-nav-inner">


            <!-- SCHEDULE -->

            <a
                class="nav-item"
                href="schedule.html"
            >

                <svg
                    class="nav-icon"
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                >

                    <rect
                        x="3"
                        y="5"
                        width="18"
                        height="16"
                        rx="3"
                    />

                    <path d="M7 3v4" />
                    <path d="M17 3v4" />

                    <path d="M3 10h18" />

                    <path d="M8 14h.01" />
                    <path d="M12 14h.01" />
                    <path d="M16 14h.01" />

                    <path d="M8 18h.01" />
                    <path d="M12 18h.01" />
                    <path d="M16 18h.01" />

                </svg>

                <span class="nav-label">
                    SCHEDULE
                </span>

            </a>


            <!-- SCORE -->

            <a
                class="nav-item"
                href="score.html"
            >

                <svg
                    class="nav-icon"
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                >

                    <rect
                        x="3"
                        y="5"
                        width="18"
                        height="14"
                        rx="2"
                    />

                    <path d="M7 9h4" />
                    <path d="M13 9h4" />

                    <path d="M7 13h2" />
                    <path d="M11 13h2" />
                    <path d="M15 13h2" />

                    <path d="M7 16h10" />

                </svg>

                <span class="nav-label">
                    SCORE
                </span>

            </a>


            <!-- HOME -->

            <a
                class="nav-item nav-home active"
                href="home.html"
                aria-current="page"
            >

                <span class="home-circle">

                    <svg
                        class="nav-icon"
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                    >

                        <path d="M3 11.5 12 4l9 7.5" />

                        <path d="M5 10.5V20h14v-9.5" />

                        <path d="M9 20v-5h6v5" />

                    </svg>

                </span>

                <span class="nav-label">
                    HOME
                </span>

            </a>


            <!-- PLAYER -->

            <a
                class="nav-item"
                href="player.html"
            >

                <svg
                    class="nav-icon"
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                >

                    <circle
                        cx="12"
                        cy="8"
                        r="3.5"
                    />

                    <path
                        d="M5 20c.7-4 3-6 7-6s6.3 2 7 6"
                    />

                </svg>

                <span class="nav-label">
                    PLAYER
                </span>

            </a>


            <!-- STATS -->

            <a
                class="nav-item"
                href="stats.html"
            >

                <svg
                    class="nav-icon"
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                >

                    <path d="M4 20V10" />
                    <path d="M10 20V4" />
                    <path d="M16 20v-7" />
                    <path d="M22 20V7" />

                </svg>

                <span class="nav-label">
                    STATS
                </span>

            </a>


        </div>

    </nav>


</div>

</body>
</html>
