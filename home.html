<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>
<meta name="theme-color" content="#07152f">
<title>Philly</title>

<style>
/* =========================================================
   Philly
   Mobile UI V1
   ========================================================= */

:root {
    --phillies-red: #e81828;
    --phillies-red-dark: #b90f1d;
    --navy: #07152f;
    --navy-2: #0b1d3d;
    --navy-3: #10264c;
    --white: #ffffff;
    --text-soft: #aebbd0;
    --border: rgba(255,255,255,0.08);

    --header-height: 74px;
    --bottom-height: 76px;
}

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html {
    width: 100%;
    min-height: 100%;
    background: var(--navy);
}

body {
    margin: 0;
    width: 100%;
    min-height: 100vh;
    min-height: 100dvh;

    background:
        radial-gradient(
            circle at 85% 0%,
            rgba(232,24,40,0.10),
            transparent 32%
        ),
        linear-gradient(
            180deg,
            #07152f 0%,
            #081936 45%,
            #061329 100%
        );

    color: var(--white);

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        Arial,
        sans-serif;

    overflow-x: hidden;
}


/* =========================================================
   APP
   ========================================================= */

.app {
    width: 100%;
    min-height: 100dvh;
    position: relative;
}


/* =========================================================
   HEADER
   ========================================================= */

.top-header {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;

    height: calc(
        var(--header-height) +
        env(safe-area-inset-top)
    );

    padding-top: env(safe-area-inset-top);

    z-index: 1000;

    overflow: hidden;

    background:
        linear-gradient(
            135deg,
            #e81828 0%,
            #d91627 48%,
            #b80f1d 100%
        );

    box-shadow:
        0 6px 22px rgba(0,0,0,0.28);
}


/*
    ネイビーの斜めレイヤー
*/

.top-header::before {
    content: "";
    position: absolute;

    top: 0;
    right: -16%;
    width: 55%;
    height: 100%;

    background:
        linear-gradient(
            135deg,
            transparent 0%,
            transparent 46%,
            var(--navy) 47%,
            var(--navy) 100%
        );

    opacity: 0.95;
}


/*
    細い赤のハイライト
*/

.top-header::after {
    content: "";

    position: absolute;

    left: 0;
    bottom: 0;

    width: 100%;
    height: 3px;

    background:
        linear-gradient(
            90deg,
            rgba(255,255,255,0.0),
            rgba(255,255,255,0.28),
            rgba(255,255,255,0.0)
        );
}


/*
    ヘッダー内部
*/

.header-inner {
    position: relative;

    width: 100%;
    height: var(--header-height);

    display: flex;
    align-items: center;
    justify-content: center;

    z-index: 2;
}


/*
    中央のアクセント
    文字は使用しない
*/

.header-mark {
    width: 42px;
    height: 42px;

    border-radius: 50%;

    border:
        2px solid
        rgba(255,255,255,0.82);

    position: relative;

    box-shadow:
        0 0 0 5px rgba(255,255,255,0.06),
        0 5px 18px rgba(0,0,0,0.20);
}


/*
    マーク内部
*/

.header-mark::before {
    content: "";

    position: absolute;

    top: 8px;
    left: 8px;

    width: 20px;
    height: 20px;

    border-radius: 50%;

    background: var(--navy);

    box-shadow:
        inset 0 0 0 2px rgba(255,255,255,0.18);
}


.header-mark::after {
    content: "";

    position: absolute;

    left: 17px;
    top: 5px;

    width: 5px;
    height: 30px;

    border-radius: 4px;

    background: var(--phillies-red);

    transform: rotate(45deg);
}


/* =========================================================
   MAIN
   ========================================================= */

main {
    width: 100%;

    padding-top:
        calc(
            var(--header-height) +
            env(safe-area-inset-top)
        );

    padding-bottom:
        calc(
            var(--bottom-height) +
            env(safe-area-inset-bottom) +
            24px
        );

    min-height: 100dvh;
}


/*
    V1確認用コンテンツ
*/

.hero {
    padding: 28px 20px 10px;
}

.hero-label {
    margin: 0 0 8px;

    font-size: 11px;
    font-weight: 800;

    letter-spacing: 0.18em;

    color: var(--phillies-red);
}

.hero-title {
    margin: 0;

    font-size: 30px;
    line-height: 1.05;
    font-weight: 900;

    letter-spacing: -0.04em;
}

.hero-subtitle {
    margin: 10px 0 0;

    color: var(--text-soft);

    font-size: 13px;
    line-height: 1.6;
}


/*
    サンプルカード
*/

.demo-card {
    margin: 18px 16px 0;

    padding: 20px;

    border-radius: 20px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,0.075),
            rgba(255,255,255,0.025)
        );

    border: 1px solid var(--border);

    box-shadow:
        0 12px 30px rgba(0,0,0,0.18);
}

.demo-card-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.demo-card-label {
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 0.14em;
    color: var(--text-soft);
}

.demo-dot {
    width: 8px;
    height: 8px;

    border-radius: 50%;

    background: var(--phillies-red);

    box-shadow:
        0 0 12px rgba(232,24,40,0.65);
}

.demo-card h2 {
    margin: 16px 0 6px;

    font-size: 22px;
    font-weight: 850;
}

.demo-card p {
    margin: 0;

    color: var(--text-soft);

    font-size: 13px;
    line-height: 1.6;
}


/* =========================================================
   BOTTOM NAVIGATION
   ========================================================= */

.bottom-nav {
    position: fixed;

    left: 0;
    right: 0;
    bottom: 0;

    height:
        calc(
            var(--bottom-height) +
            env(safe-area-inset-bottom)
        );

    padding-bottom: env(safe-area-inset-bottom);

    z-index: 1100;

    background:
        rgba(5,17,39,0.96);

    border-top:
        1px solid
        rgba(255,255,255,0.07);

    box-shadow:
        0 -10px 30px rgba(0,0,0,0.24);

    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
}


.nav-inner {
    width: 100%;
    height: var(--bottom-height);

    display: grid;
    grid-template-columns:
        repeat(5, 1fr);

    align-items: stretch;
}


/* =========================================================
   NAV ITEM
   ========================================================= */

.nav-item {
    position: relative;

    display: flex;
    flex-direction: column;

    align-items: center;
    justify-content: center;

    gap: 5px;

    min-width: 0;

    color: #71809a;

    text-decoration: none;

    transition:
        color 0.18s ease,
        transform 0.18s ease;
}


.nav-item:active {
    transform: scale(0.94);
}


.nav-icon {
    width: 21px;
    height: 21px;

    stroke: currentColor;

    stroke-width: 1.9;

    fill: none;

    stroke-linecap: round;
    stroke-linejoin: round;

    transition:
        transform 0.18s ease,
        filter 0.18s ease;
}


.nav-label {
    font-size: 8.5px;

    line-height: 1;

    font-weight: 800;

    letter-spacing: 0.06em;

    white-space: nowrap;
}


/* =========================================================
   ACTIVE
   ========================================================= */

.nav-item.active {
    color: var(--phillies-red);
}


.nav-item.active .nav-icon {
    transform: translateY(-1px);

    filter:
        drop-shadow(
            0 0 7px
            rgba(232,24,40,0.45)
        );
}


.nav-item.active::after {
    content: "";

    position: absolute;

    left: 50%;
    bottom: 4px;

    width: 22px;
    height: 3px;

    border-radius: 99px;

    background: var(--phillies-red);

    transform: translateX(-50%);

    box-shadow:
        0 0 9px
        rgba(232,24,40,0.55);
}


/* =========================================================
   HOME SPECIAL
   ========================================================= */

.nav-item.home-item .nav-icon-wrap {
    width: 38px;
    height: 38px;

    margin-top: -8px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 50%;

    background:
        linear-gradient(
            145deg,
            #e81828,
            #b90f1d
        );

    color: white;

    border:
        3px solid var(--navy);

    box-shadow:
        0 4px 14px rgba(232,24,40,0.30);
}


.nav-item.home-item .nav-icon {
    width: 20px;
    height: 20px;

    stroke-width: 2.2;
}


.nav-item.home-item.active .nav-icon-wrap {
    box-shadow:
        0 0 0 3px rgba(232,24,40,0.12),
        0 5px 18px rgba(232,24,40,0.40);
}


.nav-item.home-item.active::after {
    display: none;
}


.nav-item.home-item .nav-label {
    margin-top: -1px;
}


/* =========================================================
   MOBILE ONLY
   ========================================================= */

@media (min-width: 700px) {
    body {
        width: 100%;
        max-width: 480px;
        margin: 0 auto;
    }

    .top-header,
    .bottom-nav {
        width: 100%;
        max-width: 480px;
        left: 50%;
        right: auto;
        transform: translateX(-50%);
    }
}
</style>
</head>


<body>

<div class="app">

    <!-- =====================================================
         HEADER
         ====================================================== -->

    <header class="top-header">
        <div class="header-inner">
            <div class="header-mark" aria-hidden="true"></div>
        </div>
    </header>


    <!-- =====================================================
         MAIN
         ====================================================== -->

    <main>

        <section class="hero">
            <p class="hero-label">PHILLIES BASEBALL</p>

            <h1 class="hero-title">
                Welcome to<br>
                Philly.
            </h1>

            <p class="hero-subtitle">
                ここに各ページのコンテンツが入ります。
            </p>
        </section>


        <section class="demo-card">

            <div class="demo-card-top">
                <span class="demo-card-label">
                    UI PREVIEW
                </span>

                <span class="demo-dot"></span>
            </div>

            <h2>Philly</h2>

            <p>
                現在は共通UIのプレビューです。
                今後ここに実際の試合・選手・成績などを追加します。
            </p>

        </section>

    </main>


    <!-- =====================================================
         BOTTOM NAVIGATION
         ====================================================== -->

    <nav class="bottom-nav" aria-label="Main navigation">

        <div class="nav-inner">

            <!-- SCHEDULE -->

            <a
                href="schedule.html"
                class="nav-item"
            >

                <svg
                    class="nav-icon"
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                >
                    <rect
                        x="3"
                        y="5"
                        width="18"
                        height="16"
                        rx="3"
                    ></rect>

                    <path d="M7 3v4"></path>
                    <path d="M17 3v4"></path>

                    <path d="M3 10h18"></path>

                    <path d="M8 14h.01"></path>
                    <path d="M12 14h.01"></path>
                    <path d="M16 14h.01"></path>

                    <path d="M8 18h.01"></path>
                    <path d="M12 18h.01"></path>
                    <path d="M16 18h.01"></path>
                </svg>

                <span class="nav-label">
                    SCHEDULE
                </span>

            </a>


            <!-- SCORE -->

            <a
                href="score.html"
                class="nav-item"
            >

                <svg
                    class="nav-icon"
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                >
                    <rect
                        x="3"
                        y="5"
                        width="18"
                        height="14"
                        rx="2"
                    ></rect>

                    <path d="M7 9h4"></path>
                    <path d="M13 9h4"></path>

                    <path d="M7 13h2"></path>
                    <path d="M11 13h2"></path>
                    <path d="M15 13h2"></path>

                    <path d="M7 16h10"></path>
                </svg>

                <span class="nav-label">
                    SCORE
                </span>

            </a>


            <!-- HOME -->

            <a
                href="index.html"
                class="nav-item home-item active"
            >

                <span class="nav-icon-wrap">

                    <svg
                        class="nav-icon"
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                    >
                        <path d="M3 11.5 12 4l9 7.5"></path>
                        <path d="M5 10.5V20h14v-9.5"></path>
                        <path d="M9 20v-5h6v5"></path>
                    </svg>

                </span>

                <span class="nav-label">
                    HOME
                </span>

            </a>


            <!-- PLAYER -->

            <a
                href="player.html"
                class="nav-item"
            >

                <svg
                    class="nav-icon"
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                >
                    <circle
                        cx="12"
                        cy="8"
                        r="3.5"
                    ></circle>

                    <path
                        d="M5 20c.7-4 3-6 7-6s6.3 2 7 6"
                    ></path>

                    <path
                        d="M8 17.5h8"
                    ></path>
                </svg>

                <span class="nav-label">
                    PLAYER
                </span>

            </a>


            <!-- STATS -->

            <a
                href="stats.html"
                class="nav-item"
            >

                <svg
                    class="nav-icon"
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                >
                    <path d="M4 20V10"></path>
                    <path d="M10 20V4"></path>
                    <path d="M16 20v-7"></path>
                    <path d="M22 20V7"></path>
                </svg>

                <span class="nav-label">
                    STATS
                </span>

            </a>

        </div>

    </nav>

</div>

</body>
</html>
